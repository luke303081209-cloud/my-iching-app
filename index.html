<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Oracle | 易问 - 古代智慧的数字共鸣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;700&display=swap');
        
        :root {
            --gold: #c5a059;
            --bg: #0f0f12;
            --card: #1a1a1f;
        }

        body { 
            background-color: var(--bg); 
            color: var(--gold); 
            font-family: 'Noto Serif SC', serif;
            overflow-x: hidden;
        }

        .line-container { width: 100%; height: 14px; margin: 10px 0; position: relative; }
        .yang-line { 
            height: 8px; width: 100%; 
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
            border-radius: 4px;
        }
        .yin-line { display: flex; justify-content: space-between; height: 8px; width: 100%; }
        .yin-line div { 
            width: 44%; height: 100%; 
            background: linear-gradient(90deg, transparent, #555, transparent); 
            border-radius: 4px;
        }
        .moving-yang { border: 1px solid #fff; }
        .moving-yin { border: 1px solid #fff; }

        .glass-panel {
            background: rgba(26, 26, 31, 0.8);
            border: 1px solid rgba(197, 160, 89, 0.2);
            backdrop-filter: blur(20px);
            border-radius: 24px;
        }

        .gold-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gold-btn:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.4);
        }
        
        .coin-icon { width: 40px; height: 40px; border: 2px solid var(--gold); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4">

    <header class="w-full max-w-lg flex justify-between items-center mb-12 animate__animated animate__fadeInDown">
        <div>
            <h1 class="text-3xl font-light tracking-[0.3em] uppercase">易问</h1>
            <p class="text-[10px] tracking-[0.5em] opacity-50">THE FLUX ORACLE</p>
        </div>
        <select id="lang-select" onchange="changeLang(this.value)" class="bg-transparent border-none text-gold text-xs outline-none cursor-pointer">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
        </select>
    </header>

    <main class="w-full max-w-md">
        <div class="glass-panel p-8 mb-8 text-center animate__animated animate__fadeIn">
            <h2 id="ui-title" class="text-lg font-light mb-6 tracking-widest">请静心思考你的问题</h2>
            <input id="user-question" type="text" class="w-full bg-transparent border-b border-gold/30 py-3 text-center text-white text-lg focus:border-gold outline-none transition-all" placeholder="...">
        </div>

        <div id="hex-container" class="glass-panel h-80 flex flex-col-reverse justify-center px-12 py-10 mb-8 relative overflow-hidden">
            <div id="empty-hint" class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none text-sm tracking-[1em]">起卦</div>
        </div>

        <div id="control-panel" class="glass-panel p-8">
            <div id="toss-ui">
                <p id="ui-step-hint" class="text-center text-xs opacity-50 mb-8 tracking-widest uppercase">第 1 爻 / 第 6 步</p>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="addLine(3)" class="gold-btn p-4 rounded-xl flex flex-col items-center">
                        <span class="coin-icon">正</span>
                        <span class="text-xs" data-i18n="btn-3">3个正面</span>
                    </button>
                    <button onclick="addLine(1)" class="gold-btn p-4 rounded-xl flex flex-col items-center">
                        <span class="coin-icon">反</span>
                        <span class="text-xs" data-i18n="btn-1">1正2反</span>
                    </button>
                    <button onclick="addLine(2)" class="gold-btn p-4 rounded-xl flex flex-col items-center">
                        <span class="coin-icon">正</span>
                        <span class="text-xs" data-i18n="btn-2">2正1反</span>
                    </button>
                    <button onclick="addLine(0)" class="gold-btn p-4 rounded-xl flex flex-col items-center">
                        <span class="coin-icon">反</span>
                        <span class="text-xs" data-i18n="btn-0">3个反面</span>
                    </button>
                </div>
            </div>

            <div id="result-ui" class="hidden text-center animate__animated animate__fadeIn">
                <p class="text-xs opacity-50 mb-2 tracking-widest">卦象已成</p>
                <h3 id="hex-result-name" class="text-3xl text-white mb-6 font-bold tracking-widest">--</h3>
                <button onclick="unlockAnalysis()" class="w-full gold-btn py-4 rounded-full font-bold tracking-widest hover:scale-105 transform">
                    解开指引
                </button>
            </div>
        </div>
    </main>

    <script>
        const hexMap = {
            "111111": "乾为天", "000000": "坤为地", "010001": "水雷屯", "100010": "山水蒙",
            "111010": "水天需", "010111": "天水讼", "000010": "地水师", "010000": "水地比",
            "111011": "风天小畜", "110111": "天泽履", "111000": "地天泰", "000111": "天地否"
        };

        const i18n = {
            zh: { title: "请静心思考你的问题", step: "第 {n} 爻 / 第 6 步", pay: "解开指引 ($1.99)" },
            en: { title: "Focus on your question", step: "Line {n} / 6", pay: "Reveal Guidance ($1.99)" }
        };

        let lines = [];
        let currentLang = 'zh';

        function addLine(val) {
            if (lines.length >= 6) return;
            lines.push(val);
            
            document.getElementById('empty-hint').style.opacity = '0';
            const container = document.getElementById('hex-container');
            const lineWrap = document.createElement('div');
            lineWrap.className = 'line-container animate__animated animate__fadeInUp';

            if (val === 3 || val === 1) {
                lineWrap.innerHTML = '<div class="yang-line"></div>';
            } else {
                lineWrap.innerHTML = '<div class="yin-line"><div></div><div></div></div>';
            }
            container.appendChild(lineWrap);

            if (lines.length < 6) {
                document.getElementById('ui-step-hint').innerText = i18n[currentLang].step.replace('{n}', lines.length + 1);
            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            document.getElementById('toss-ui').classList.add('hidden');
            document.getElementById('result-ui').classList.remove('hidden');
            
            const code = lines.map(v => (v === 3 || v === 1) ? "1" : "0").join("");
            const name = hexMap[code] || "大衍之卦";
            document.getElementById('hex-result-name').innerText = name;
        }

        function unlockAnalysis() {
            alert("即将跳转至支付界面。支付成功后，AI 将结合您的卦象及问题生成深度解析报告。");
        }

        function changeLang(l) {
            currentLang = l;
            document.getElementById('ui-title').innerText = i18n[l].title;
        }
    </script>
</body>
</html>
